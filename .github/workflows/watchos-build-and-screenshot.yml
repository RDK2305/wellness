name: watchOS Build & Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick a watchOS simulator
        run: |
          SIM_JSON=$(xcrun simctl list devices available -j)
          SIM_UDID=$(echo "$SIM_JSON" | jq -r '.devices | to_entries[] | .value[] | select(.name | test("Watch")) | .udid' | head -n1)
          SIM_NAME=$(echo "$SIM_JSON" | jq -r --arg udid "$SIM_UDID" '.devices | to_entries[] | .value[] | select(.udid==$udid) | .name')
          if [ -z "$SIM_UDID" ]; then
            echo "No watchOS simulator found on this runner image." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $SIM_NAME ($SIM_UDID)"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project "WellnessCompanion Watch App.xcodeproj" \
            -scheme "WellnessCompanion Watch App" \
            -destination "platform=watchOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install & launch app
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="build/Build/Products/Debug-watchsimulator/WellnessCompanion Watch App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at expected path:" >&2
            find build/Build/Products -maxdepth 2 >&2
            exit 1
          fi

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" com.ramankumari.wellnesscompanion.watchkitapp
          sleep 6

      - name: Capture standalone screenshot
        run: |
          mkdir -p ci-output
          xcrun simctl io "$SIM_UDID" screenshot "ci-output/00-dashboard-standalone.png"

      - name: Run UI test to capture all 3 screens
        continue-on-error: true
        run: |
          xcodebuild test \
            -project "WellnessCompanion Watch App.xcodeproj" \
            -scheme "WellnessCompanion Watch App" \
            -destination "platform=watchOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath ci-output/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test result bundle
        if: always()
        run: |
          set -x
          RESULT="ci-output/TestResults.xcresult"
          mkdir -p ci-output/debug-json
          if [ ! -d "$RESULT" ]; then
            echo "No TestResults.xcresult produced; skipping extraction."
            exit 0
          fi

          # Step 1: root record -> id of the tests summary
          xcrun xcresulttool get --format json --path "$RESULT" > ci-output/debug-json/root.json
          TESTS_REF_ID=$(jq -r '.actions._values[0].actionResult.testsRef.id._value' ci-output/debug-json/root.json)
          echo "testsRef id: $TESTS_REF_ID"

          # Step 2: tests summary -> ids of each test method's detailed summary
          xcrun xcresulttool get --format json --path "$RESULT" --id "$TESTS_REF_ID" > ci-output/debug-json/tests.json
          SUMMARY_IDS=$(jq -r '.. | objects | select(has("summaryRef")) | .summaryRef.id._value' ci-output/debug-json/tests.json | sort -u)
          echo "summary ids: $SUMMARY_IDS"

          # Step 3: each test method summary -> attachment payloadRefs (possibly nested in subactivities)
          : > ci-output/debug-json/all_summaries.jsonl
          for sid in $SUMMARY_IDS; do
            xcrun xcresulttool get --format json --path "$RESULT" --id "$sid" >> ci-output/debug-json/all_summaries.jsonl
            echo >> ci-output/debug-json/all_summaries.jsonl
          done

          jq -s -r '.[] | .. | objects | select(has("payloadRef") and has("name")) | "\(.name._value // "unnamed")\t\(.payloadRef.id._value)"' \
            ci-output/debug-json/all_summaries.jsonl | sort -u > ci-output/debug-json/attachments.tsv
          echo "Found attachments:"
          cat ci-output/debug-json/attachments.tsv

          while IFS=$'\t' read -r name id; do
            [ -z "$id" ] && continue
            safe_name=$(echo "$name" | tr -c 'A-Za-z0-9._-' '_')
            echo "Exporting $name ($id)"
            xcrun xcresulttool export --type file --path "$RESULT" --id "$id" --output-path "ci-output/${safe_name}.png" || true
          done < ci-output/debug-json/attachments.tsv

          echo "ci-output contents:"
          find ci-output -maxdepth 1 -type f

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchos-screenshots
          path: ci-output/*.png
          if-no-files-found: error

      - name: Upload debug JSON (for troubleshooting extraction)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-debug-json
          path: ci-output/debug-json
          if-no-files-found: ignore
